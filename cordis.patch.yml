# The dsh-terminal bundle patch: interactive terminal surface over dsh-base.
# Single-session, process-wide agent (like headless). Unlike web, base tool
# rows stay enabled — the TUI is a window onto vanilla DSH, not a second host.
#
# Profile setup:
#   dsh plugin --profile terminal add dsh-terminal
#   dsh --profile terminal

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # PTC mode is a core execution capability shared with headless/web.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Cordis inspect and dynamic runner for creator mode (cordis preset).
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Durable storage + workspace registry: the same rows (same ids) as the
    # installed Web bundle, so terminal sessions share Web's per-directory
    # workspaces and `ctx.workspaceRegistry`. The registry persists through
    # storage-domain over the json backend. When these rows are absent (older
    # compositions) sessions stay unattached instead of failing.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # The model-facing ask_user_question tool (a preset row on web; the
    # rosterless terminal composes it process-wide so the agent can ask).
    # Answered by this surface's userQuestions provider (modal/form).
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # The preset roster: shipped presets (standard, code, minimal, cordis)
    # plus locally authored user presets from $DSH_HOME/.agent-presets.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Parses terminal app flags, then provides terminalStartup.
    - id: terminal-startup
      name: 'dsh-terminal/startup'

    # Interactive TTY runner: creates one Agent, streams, renders, exits on /quit.
    - id: terminal-runner
      name: 'dsh-terminal'
      inject: [terminalStartup]
      config:
        resume: !!js ctx.terminalStartup.resume
        model: !!js ctx.terminalStartup.model
        provider: !!js ctx.terminalStartup.provider
        print: !!js ctx.terminalStartup.print
        line: !!js ctx.terminalStartup.line
        preset: !!js ctx.terminalStartup.preset
